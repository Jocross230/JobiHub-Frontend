<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  />

  <!-- SEO -->
  <title>JobiHub | Global Remote Jobs & Career Opportunities</title>

  <meta
          name="description"
          content="JobiHub brings remote jobs and global career opportunities together in one place. Discover jobs, build your CV, create cover letters, apply for opportunities and grow your career."
  />

  <link
          rel="canonical"
          href="https://jobihub.fit/"
  />

  <!-- Browser tab icon -->
  <link
          rel="icon"
          type="image/png"
          href="/favicon.png"
  />

  <!-- Apple/iOS icon -->
  <link
          rel="apple-touch-icon"
          href="/favicon.png"
  />

  <!-- JobiHub organization information for search engines -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "JobiHub",
      "url": "https://jobihub.fit",
      "logo": "https://jobihub.fit/favicon.png",
      "description": "JobiHub is a global career and recruitment hub connecting job seekers with opportunities and businesses with talent."
    }
  </script>
</head>

<body>
<div id="root"></div>

<script
        type="module"
        src="/src/main.tsx"
></script>

</html>
